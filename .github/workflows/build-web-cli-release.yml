name: Build Web CLI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (for example, v2.1.53 or main)'
        required: true
        default: main
        type: string
      tag:
        description: 'Release tag to create or update (for example, v2.1.53)'
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_INSTALL_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm


    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare generated resources
        run: bun run postinstall || true

      - name: Build desktop renderer
        run: bunx electron-vite build --config packages/desktop/electron.vite.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Pack Web CLI tarball
        shell: bash
        run: node scripts/pack-web-cli.js
        env:
          PACK_PLATFORM: ${{ matrix.platform }}
          PACK_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-web-cli/*.tar.gz
            dist-web-cli/*.sha256
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify Linux x86_64 package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: web-cli-linux-x64
          path: dist-web-cli

      - name: Verify archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find dist-web-cli -maxdepth 1 -name '*.tar.gz' -type f -print -quit)
          test -n "$archive"
          checksum="${archive}.sha256"
          test -f "$checksum"
          (
            cd "$(dirname "$archive")"
            sha256sum -c "$(basename "$checksum")"
          )
          tar -tzf "$archive" | grep -Fx 'aionui-web/aionui-web'
          tar -tzf "$archive" | grep -Fx 'aionui-web/static/index.html'
          tar -tzf "$archive" | grep -F 'aionui-web/bundled-aioncore/linux-x64/aioncore'

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, verify]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag="$GITHUB_REF_NAME"
          fi

          expected_tag="v${version}"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::Release tag $tag does not match package.json version $version (expected $expected_tag)."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: web-cli-*
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux-arm64 linux-x86_64; do
            archive="release-assets/aionui-web-${VERSION}-${platform}.tar.gz"
            test -s "$archive"
            test -s "${archive}.sha256"
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AionUi ${TAG#v}" \
              --generate-notes
          fi
